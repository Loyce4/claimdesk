services:
  db:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_USER: claimdesk
      POSTGRES_PASSWORD: claimdesk
      POSTGRES_DB: claimdesk
    volumes:
      - claimdesk_db_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U claimdesk"]
      interval: 5s
      timeout: 3s
      retries: 10

  backend:
    build: ./backend
    restart: unless-stopped
    env_file: .env
    environment:
      # Dans le réseau Docker, la base est joignable par le nom du service,
      # pas par localhost. Surcharge la valeur du .env prévue pour le dev local.
      DATABASE_URL: postgres://claimdesk:claimdesk@db:5432/claimdesk
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "8000:8000"
    volumes:
      - ./backend/src:/app/src
      - ./backend/tests:/app/tests
      - ./backend/uploads:/app/uploads

  odoo:
    image: odoo:17
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      HOST: db
      PORT: "5432"
      USER: claimdesk
      PASSWORD: claimdesk
    ports:
      - "8069:8069"
    volumes:
      - claimdesk_odoo_data:/var/lib/odoo
      - ./odoo/addons:/mnt/extra-addons
      - ./odoo/odoo.conf:/etc/odoo/odoo.conf
  # frontend:
  #   build: ./frontend
  #   restart: unless-stopped
  #   depends_on:
  #     - backend
  #   ports:
  #     - "3000:3000"
  #   volumes:
  #     - ./frontend:/app

volumes:
  claimdesk_db_data:
  claimdesk_odoo_data: